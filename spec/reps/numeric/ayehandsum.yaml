  not_pinned:
  - alphabet: dickens
    reason: 'not established: the alphabet is fetched from the network at run time (unpinned)'
  - alphabet: research
    reason: 'not established: the alphabet is fetched from the network at run time (unpinned)'
  - alphabet: wordsworth
    reason: 'not established: the alphabet is fetched from the network at run time (unpinned)'
  symbol_order: the first symbol of the base list has index symbols-1 (the padding), the last has index 0; index symbols-2
    never occurs as a digit
decoding:
  rule: 'ayecode-decode: symbols back to indices (longest symbols first), padding dropped, each word read in base symbols-2
    and printed as 8 hexadecimal digits'
semantics:
  statement: 'A reversible writing of a digest: decode(encode(d)) = d for every pinned alphabet in the corpus.'
  reference_sources:
  - reports/readings/ayehandsum.json
  - repsynth/lanes/oracles.py
  oracle_sources:
  - ayehandsum/ayehandsum@f338cba829c8ab0b1707e7ae25fb9d121356976a:ayesha
  - ayehandsum/ayehandsum@f338cba829c8ab0b1707e7ae25fb9d121356976a:ayecode-config
  - ayehandsum/ayehandsum@f338cba829c8ab0b1707e7ae25fb9d121356976a:ayecode-encode
  - ayehandsum/ayehandsum@f338cba829c8ab0b1707e7ae25fb9d121356976a:ayecode-decode
  oracle: ayehandsum/ayehandsum@f338cba829c8ab0b1707e7ae25fb9d121356976a inside AyeVDI (ayevdi/ayevdi, pinned)
operations: []
composition:
  words: Words are written one after another with no separator.
transformations:
- name: decode
  to: digest
  preserves: the digest, lossless for the 12 pinned alphabets on the corpus
constraints:
- name: large_base
  statement: The rules assume symbols - 2 > 16 (bc prints digits as decimals above base 16).
substrate:
  logical: other
  register_widths:
  - digits: 8
    register_bits: 32
interfaces:
  imports:
  - a hash command (sha3sum, shasum, md5sum)
  exports:
  - the encoded string
verification:
  properties:
  - name: rules_reproduce_oracle
    method: 'python3 -m repsynth oracles check ayehandsum: every corpus digest re-encoded from these rules equals the oracle''s
      encoding'
  - name: round_trip
    method: the oracle's own decode returns the digest (reports/oracles/ayehandsum.json)
generation:
  software: 'none: the legacy source stays the implementation (GEN-01)'
evolution:
  changes:
  - version: 0.3.0
    class: initial
    summary: Extracted from ayehandsum/ayehandsum
provenance:
  oracle:
    value: ayehandsum/ayehandsum@f338cba829c8ab0b1707e7ae25fb9d121356976a
    evidence: measured
    source: reports/readings/ayehandsum.json
  extraction: Rules read from ayecode-config and ayecode-encode; alphabets read by sourcing each ayecode-base file; confirmed
    by re-encoding the oracle's corpus.
  evidence_state: extracted
