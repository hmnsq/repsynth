identity:
  id: hindawi_shaili_pipeline
  version: 0.3.0
  family: symbolic_pipeline
  title: Hindawi's composing pipeline per shaili, as opaque transforms run by Chintamani's drivers
  equality: Two pipelines are equal when every stage names the same transform with the same arguments in the same order.
  canonical_form: Stages in the order the driver applies them.
domain:
  description: Hindawi programs in UTF-8 whose first line names a shaili (<शैली ...>).
  finite: false
structure:
  stages:
  - common prefix of the driver (Unicode to ACII)
  - header split (the awk driver)
  - the shaili's transducer and its post-processing (dispatched by header)
  transducers: 'Opaque: each is the shaili''s flex program built from its .uhin file; the harness never reads or regenerates
    them (GOV-03, GOV-17).'
encoding:
  shailis:
  - header: praa_tha
    forward:
      driver: Hindawi/hindrv/hin2std
      common_prefix:
        command: cat $1 | fixuninum | sed 's/\\न/\\n/g; s/\%भ/\%f/g; s/\%प/\%d/g;' | iconv -f utf-8 -t utf-16 | uni2acii |
          acii2cf | hin2std.awk
        line: 36
      dispatch:
        file: Hindawi/hindrv/hin2std.awk
        line: 54
        command: (echo "<shailee praa_tha>"; cat tempfil012345.temphin | h2b | acii2hin) > hin.std
      transforms:
      - transform: h2b
        source: Hindawi/praatha/h2b.uhin, built by Hindawi/praatha/Makefile (flex)
      - transform: acii2hin
        source: Romenagri/acii2hin, built by Romenagri/Makefile
    reverse:
      driver: Hindawi/hindrv/std2hin
      common_prefix:
        command: cat $1 | sed 's/\\n/\\न/g; s/\%f/\%भ/g; s/\%d/\%प/g;' | iconv -f utf-8 -t utf-16 | uni2acii | acii2cf | std2hin.awk
        line: 36
      dispatch:
        file: Hindawi/hindrv/std2hin.awk
        line: 54
        command: (echo "<shailee praa_tha>"; cat tempfil012345.temphin | tr 'A-Z' 'a-z' | b2h | sed 's/_/__/g') | rmn2acii
          | acii2uni | iconv -futf16 -tutf8 > hin.uhin
      transforms:
      - transform: tr 'A-Z' 'a-z'
        source: POSIX tr, arguments as written
      - transform: b2h
        source: Hindawi/praatha/b2h.uhin, built by Hindawi/praatha/Makefile (flex)
      - transform: sed 's/_/__/g'
        source: POSIX sed, arguments as written
    compile:
      driver: Hindawi/hindrv/hincc
      dispatch:
        file: Hindawi/hindrv/hincc.awk
        line: 54
        command: praathacc tempfil012345.temphin
