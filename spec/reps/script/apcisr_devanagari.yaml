decoding:
  inverse:
    not_established: APCISR renders and does not decode; the inverse is outside the oracle
semantics:
  statement: Each chart entry ORs its nine grid values into the working map at the current matrik, lipik and purak columns,
    unless a dynamic rule of acii2cisr() places it (rule_governed).
  reference_sources:
  - reports/readings/apcisr.json
  - repsynth/lanes/oracles.py
  oracle_sources:
  - hindawiai/chintamani@cf614ff2dd8da9e23f2f98c49686640e2ec2e181:APCISR/apcisr.h
  - hindawiai/chintamani@cf614ff2dd8da9e23f2f98c49686640e2ec2e181:APCISR/acii2csr.c
  - hindawiai/chintamani@cf614ff2dd8da9e23f2f98c49686640e2ec2e181:APCISR/cisr2asc.h
  oracle: hindawiai/chintamani@cf614ff2dd8da9e23f2f98c49686640e2ec2e181, APCISR/Makefile; traced build from hindawiai/hindawi2026.10
    docs/trace/apcisr/src
operations: []
composition:
  rule: 'acii2cisr(): cursor rules for purna entries, delayed hal, ra+hal, and the special rules listed in reports/readings/apcisr_9grid_reading.md'
transformations:
- name: render
  to: apcisr_font_codes
  preserves: cluster boundaries as columns (to be measured at P6.4)
constraints:
- name: chart_lookup
  statement: Input bytes with no chart entry are rendered as non-ISCII (madhya 192).
substrate:
  logical: other
  register_widths: []
interfaces:
  imports:
  - romenagri_devanagari (ACII bytes)
  exports:
  - working map for text-mode rendering
verification:
  properties:
  - name: cells_reproduced
    method: 'python3 -m repsynth oracles check apcisr: the chart re-read and every entry re-run through the traced acii2cisr();
      observed cells must equal this file'
  - name: corpus
    method: APCISR/test.aci token by token; counts in reports/readings/apcisr.json
generation:
  apcisr_tables:
    not_established: generation of grid tables for other scripts starts at P6.3, after the author confirms the reading (P6.1)
evolution:
  changes:
  - version: 0.3.0
    class: initial
    summary: Extracted from APCISR in hindawiai/chintamani
provenance:
  oracle:
    value: hindawiai/chintamani@cf614ff2dd8da9e23f2f98c49686640e2ec2e181:APCISR/
    evidence: measured
    source: reports/readings/apcisr.json
  extraction: Chart dumped from apcisr.h by oracles/apcisr/dump_chart.c; cells observed through the author's traced build
    of acii2cisr(); disagreements recorded, the oracle winning.
  evidence_state: extracted
