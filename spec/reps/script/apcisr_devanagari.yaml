identity:
  id: apcisr_devanagari
  version: 0.3.0
  family: script_structure
  title: APCISR 9-grid instance for Devanagari, as the oracle's chart and acii2cisr() define it
  equality: Two renditions are equal when their working maps (urdha, madhya, nimna per column) are equal.
  canonical_form:
    not_established: APCISR defines no canonical form of a rendition; P6.1 asks the author
domain:
  description: The 82 entries of apcisr_chrt (APCISR/apcisr.h), keyed by ACII byte sequences.
  finite: true
  enumerator: encoding.grid_table in chart order (lookup takes the first entry whose ACII prefixes the input).
structure:
  grid:
    rows:
    - urdha
    - madhya
    - nimna
    columns:
    - matrik
    - lipik
    - purak
    row_offsets:
      urdha: 0
      madhya: 3
      nimna: 6
    column_offsets:
      matrik: 0
      lipik: 1
      purak: 2
    source: hindawiai/chintamani@cf614ff2dd8da9e23f2f98c49686640e2ec2e181:APCISR/apcisr.h, static ints _urdha, _madhya, _nimna,
      _matrik, _lipik, _purak
  cell: An 8-bit value; its bits select glyph parts that the font substitution (cisr2asc.h) maps to the code points of devnagri.f08
    and devnagri.f16.
  purna: '0: a sign that joins the current varna; 1 and 2: a new varna (values as in the chart)'
