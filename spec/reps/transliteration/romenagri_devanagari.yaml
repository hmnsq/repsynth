semantics:
  statement: Romenagri is defined by its implementation; each mapping here is what the oracle's filters output for the isolated
    element, one per line.
  reference_sources:
  - reports/readings/romenagri.json
  - repsynth/lanes/oracles.py
  oracle_sources:
  - project-ilm/romenagri2026.10@e9d762804feb0159c6739f242378d58286dbd3f0:Romenagri/uni2acii.c
  - project-ilm/romenagri2026.10@e9d762804feb0159c6739f242378d58286dbd3f0:Romenagri/acii2uni.c
  - project-ilm/romenagri2026.10@e9d762804feb0159c6739f242378d58286dbd3f0:Romenagri/acii2rmn.c
  - project-ilm/romenagri2026.10@e9d762804feb0159c6739f242378d58286dbd3f0:Romenagri/rmn2acii.c
  oracle: project-ilm/romenagri2026.10@e9d762804feb0159c6739f242378d58286dbd3f0, filters built with Romenagri/Makefile
operations: []
composition:
  rule: Words compose by the parser of rmn2acii; its grammar is TRANSLITERATION.md section 5.3 of the oracle.
transformations:
- name: to_romenagri
  to: romenagri_ascii
  preserves: text, lossless on the domain where inverse_exact holds
- name: to_unicode
  to: unicode_devanagari
  preserves: text, as observed in decoding
constraints:
- name: in_domain
  statement: Only code points listed in encoding.unicode_to_acii are covered.
substrate:
  logical: other
  register_widths: []
interfaces:
  imports: []
  exports:
  - Romenagri forms used by Hindawi's compiler front end
verification:
  properties:
  - name: table_reproduced
    method: 'python3 -m repsynth oracles check romenagri: executes uni2acii, acii2uni, rmn2acii and acii2rmn on every row
      and compares with this file'
  - name: corpus_round_trip
    method: the oracle's own Hindi corpus through the whole chain and back; counts recorded in reports/readings/romenagri.json
generation:
  software: 'none: the legacy source stays the implementation (GEN-01)'
