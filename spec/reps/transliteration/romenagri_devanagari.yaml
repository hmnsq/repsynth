identity:
  id: romenagri_devanagari
  version: 0.3.0
  family: transliteration
  title: 'Romenagri: Devanagari through ACII to ASCII-7 Romenagri, as the 2026.10 oracle behaves'
  equality: Two texts are equal when their byte sequences in the stated form (UTF-8, ACII or Romenagri) are equal.
  canonical_form: Unicode text in NFC is not assumed; the oracle's input is UTF-16 from iconv, as the Hindawi drivers feed
    it.
domain:
  description: The 85 Unicode code points of Romenagri/unicode.h and the 96 Romenagri keys of Romenagri/acii.h.
  finite: true
  enumerator: The rows of encoding.unicode_to_acii and encoding.acii_to_romenagri, in table order.
structure:
  chain:
  - UTF-8 text
  - UTF-16 (iconv)
  - ACII bytes (uni2acii)
  - Romenagri ASCII (acii2rmn)
  inverse_chain:
  - Romenagri ASCII
  - ACII bytes (rmn2acii, a recursive-descent parser)
  - UTF-16 (acii2uni)
  - UTF-8 text (iconv)
  tables:
    unicode.h: code point to ACII byte
    acii.h: Romenagri key to ACII bytes
    aciihin.h: ACII to saral rendering (not used by this specification)
